<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB QUIZ</title>
</head>
<body>

    <h1>LAB QUIZ</h1>
    
    <div id="progress">Question 1 of 6</div>
    <h3 id="question-text">Question text</h3>
    
    <div id="options-box"></div>
    
    <div id="feedback-box" style="margin-top: 20px; font-weight: bold;"></div>
    
    <button id="next-button" onclick="nextQuestion()" style="display: none; margin-top: 20px;">Next Question</button>

<script>
    const questions = [
        {
            question: "What class is an oxidising material?",
            options: ["Class A", "Class B", "Class C", "Class D"],
            correct: 2
        },
        {
            question: "Does glass go into the regular recycling?",
            options: ["Yes", "No"],
            correct: 1
        },
        {
            question: "Should hair be tied up in the lab?",
            options: ["Yes", "No"],
            correct: 0
        },
        {
            question: "How do you deal with broken glass?",
            options: [
                "Touch it with your bare hands and eat it.", 
                "Call a teacher over and slowly scoop it up into the trash", 
                "Do nothing."
            ],
            correct: 2
        },
        {
            question: "What atomic number is cerium?",
            options: ["34", "56", "58", "68"],
            correct: 2
        },
        {
            question: "When performing an experiment what do you do with the chairs?",
            options: ["Stand up on them", "Sit down while performing it", "Push them in", "play tag with them🤑"],
            correct: 2
        }
    ];

    let currentQuestionIndex = 0;

    const progressEl = document.getElementById('progress');
    const questionTextEl = document.getElementById('question-text');
    const optionsBoxEl = document.getElementById('options-box');
    const feedbackBoxEl = document.getElementById('feedback-box');
    const nextButtonEl = document.getElementById('next-button');

    function loadQuestion() {
        const currentQuestion = questions[currentQuestionIndex];
        
        progressEl.innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        questionTextEl.innerText = currentQuestion.question;
        optionsBoxEl.innerHTML = '';
        feedbackBoxEl.innerText = '';
        nextButtonEl.style.display = 'none';

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.style.display = "block";
            button.style.marginBottom = "5px";
            button.onclick = () => selectOption(index);
            optionsBoxEl.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        const currentQuestion = questions[currentQuestionIndex];
        const buttons = optionsBoxEl.getElementsByTagName('button');

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
        }

        if (selectedIndex === currentQuestion.correct) {
            feedbackBoxEl.innerText = "Correct!";
        } else {
            feedbackBoxEl.innerText = "Incorrect.";
        }

        nextButtonEl.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            currentQuestionIndex = 0;
            loadQuestion();
        }
    }

    loadQuestion();
</script>

</body>
</html>
